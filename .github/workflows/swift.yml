name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests and print failure details
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee swift-test.log
          test_status=${PIPESTATUS[0]}

          echo "---- Test failure details ----"
          grep -ni -B 3 -A 8 -E 'error:|XCTAssert|failed' swift-test.log || true

          exit "$test_status"
