name: Swift

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests and print failure details
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee swift-test.log
          test_status=${PIPESTATUS[0]}

          echo "---- Test failure details ----"
          grep -ni -B 3 -A 8 -E 'error:|XCTAssert|failed' swift-test.log || true

          exit "$test_status"
