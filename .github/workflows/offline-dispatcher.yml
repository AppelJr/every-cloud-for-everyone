name: Offline dispatcher tests

on:
  push:
    branches:
      - main
      - copilot/portable-sealer-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dispatcher tests
        working-directory: infrastructure/mcp_authority
        run: python -m unittest discover -s tests -v
