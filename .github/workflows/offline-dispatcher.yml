name: Offline dispatcher tests

on:
  push:
    branches:
      - main
      - copilot/portable-sealer-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # actions/checkout v5.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # actions/setup-python v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dispatcher tests
        working-directory: infrastructure/mcp_authority
        run: python -m unittest discover -s tests -v
