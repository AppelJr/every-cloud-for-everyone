name: Portable sealer core

on:
  push:
    branches: [main, codex/universal-portable-sealer-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-python-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust unit tests
        working-directory: portable/rust
        run: cargo test
      - name: Build CLI
        working-directory: portable/rust
        run: cargo build
      - name: Configure native CLI path (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "SOVEREIGN_SEALER_BIN=portable/rust/target/debug/sovereign-sealer" >> "$GITHUB_ENV"
      - name: Configure native CLI path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: "Add-Content -Path $env:GITHUB_ENV -Value 'SOVEREIGN_SEALER_BIN=portable/rust/target/debug/sovereign-sealer.exe'"
      - name: Python client tests
        working-directory: portable/python
        run: python -m unittest -v
      - name: Node client tests
        working-directory: portable/javascript
        run: node --test test/*.test.mjs
